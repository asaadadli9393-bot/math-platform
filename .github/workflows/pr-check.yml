# ============================================================
#  .github/workflows/pr-check.yml
#  منصة الرياضيات | الأستاذ عدلي أسعد
# ============================================================
#  فحوصات قبل الدمج: TypeScript + Lint + Build
#  يُشغّل على كل pull request و push لفروع غير main.
# ============================================================

name: 🔍 PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Type-check + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile || npm ci

      - name: 🔄 Switch Prisma to PostgreSQL
        run: |
          sed -i 's|provider = "sqlite"|provider = "postgresql"|' prisma/schema.prisma || true

      - name: 🔨 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🔍 TypeScript Check
        run: npx tsc --noEmit

      - name: 🧹 Lint
        run: bun run lint
        continue-on-error: true

      - name: 🏗️ Build Test
        run: npx next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
